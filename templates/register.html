<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header">
            <h1>Register as a Farmer</h1>
            <p>Create your account to discover nearby equipment owners and reserve tools instantly.</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="form-card">
            <form method="POST">
                <div>
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" placeholder="Enter your full name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Create a password" required>
                </div>

                <button type="submit">Register</button>
            </form>

            <p class="info-text">Already registered? <a href="/login">Login instead</a>.</p>
        </div>
    </div>
</div>
</body>
</html>
